        <div class="r09-dot" id="r09-dot-1" style="left: 90px; top: 60px"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      // cues: Und@0.35 · er@0.65 · sieht,@0.79 · wo@1.05 · Eigentümer@1.27 · auf@1.89 · seiner@2.04 ·
      // Seite@2.31 · wirklich@2.66 · klicken.@3.02
      // headline (rendered, no "Und"/"auf seiner Seite"): Er sieht, wo Eigentümer wirklich klicken.
      const words = gsap.utils.toArray("#r09-headline .r09-word");
      const wordStarts = [0.65, 0.79, 1.05, 1.27, 2.66, 3.02];

      const tl = gsap.timeline({ paused: true });

      words.forEach((w, i) => {
        tl.fromTo(
          w,
          { y: 40, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
          wordStarts[i],
        );
      });

      // Highlighter under "wirklich" on its own cue
      tl.fromTo(
        "#r09-headline .r09-hl-bar",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power3.out" },
        2.66,
      );

      // Scene 1: card + label pop in at start (settle well before 1.0s)
      tl.fromTo(
        "#r09-card",
        { scale: 0.92, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.1,
      );
      tl.fromTo("#r09-label", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.2);

      // Scene 2: heatmap dots bloom in one by one from "wirklich" (2.66s) to end of frame (4.5s),
      // the largest landing on the button last — ambient-glow-bloom per dot, deterministic positions/order.
      const dotIds = [
        "#r09-dot-1",
        "#r09-dot-2",
        "#r09-dot-3",
        "#r09-dot-4",
        "#r09-dot-5",
        "#r09-dot-6",
        "#r09-dot-7",
      ];
      const BLOOM_START = 2.66;
      const STAGGER = 0.19;
      dotIds.forEach((sel, i) => {
        const at = BLOOM_START + i * STAGGER;
        tl.fromTo(
          sel,
          { opacity: 0, scale: 0.85, xPercent: -50, yPercent: -50 },
          { opacity: 1, scale: 1, xPercent: -50, yPercent: -50, duration: 0.55, ease: "power2.out" },
          at,
        );
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["09-heatmap"] = tl;
    })();
  </script>
