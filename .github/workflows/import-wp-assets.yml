name: Import WP Assets

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "WordPress site to import from"
        required: false
        default: "https://beuwy.com"
      max_files:
        description: "Hard cap on number of files"
        required: false
        default: "200"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Import WP media
        env:
          WP_SITE_URL: ${{ inputs.site_url }}
          MAX_FILES: ${{ inputs.max_files }}
        run: node scripts/import-wp-assets.js

      - name: Commit + push
        run: |
          if [ -z "$(git status --porcelain public/assets/wp)" ]; then
            echo "no new files — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/wp
          git commit -m "chore(assets): import WP media from ${{ inputs.site_url }}"
          git push
